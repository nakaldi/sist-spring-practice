<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div class="container">
    <form action="/members/signUp" method="post">
        <div class="form-group">
            <label for="email">EMAIL</label>
            <input type="text" id="email" name="email" placeholder="이메일을 입력하세요">
            <label for="password">PASSWORD</label>
            <input type="text" id="password" name="password" placeholder="비밀번호를 입력하세요">
            <label for="phoneNumber">PHONE NUMBER</label>
            <input type="text" id="phoneNumber" name="phoneNumber" placeholder="핸드폰 번호를 입력하세요">
            <label for="fullName">FULL NAME</label>
            <input type="text" id="fullName" name="fullName" placeholder="이름을 입력하세요">
        </div>
        <button type="submit">등록</button>
    </form>
</div> <!-- /container -->
</body>
</html>
